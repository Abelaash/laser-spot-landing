name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy from the Actions tab without pushing a commit —
  # useful after changing a repository variable such as the GTM ID.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue rather than cancel, so a run that is
# already publishing is allowed to finish.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static export
        env:
          # NEXT_PUBLIC_* values are inlined into the bundle at build time, so
          # they must be present HERE — setting them anywhere else has no
          # effect. They are repository *Variables*, not Secrets: anything
          # NEXT_PUBLIC_ is readable in the shipped JavaScript by design, and
          # Secrets would only create a false sense of confidentiality.
          #
          # Set these under Settings -> Secrets and variables -> Actions -> Variables.
          NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID }}
          NEXT_PUBLIC_FORM_ENDPOINT: ${{ vars.NEXT_PUBLIC_FORM_ENDPOINT }}
          # Served from the root of book.laserspot.ca, so no base path.
          # (A GitHub Pages *project* site would need NEXT_PUBLIC_BASE_PATH set
          # to /laser-spot-landing here; a custom domain must not have it.)
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
